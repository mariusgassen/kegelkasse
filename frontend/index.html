<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="theme-color" content="#3d3540"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <!-- black-translucent: the installed iOS PWA draws behind the status bar, so the live island
         (#111, lib/island) can sit on the Dynamic Island instead of below it. The header's
         .safe-top spacer (env(safe-area-inset-top)) keeps the app content below the status bar.
         Known WebKit quirk with this value: the layout viewport stays screen.height −
         safe-area-inset-top tall while being shifted up behind the status bar, so anything sized
         with `100%`/`inset: 0` leaves a dead strip at the bottom (measured: 852−59=793, 59px
         gap). `100vh` is the full screen there, so index.css sizes html/body/#root with it in
         standalone mode. With the previous `black` value iOS laid the web view out *below* the
         status bar, which no CSS can draw over. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <title>Kegelkasse</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml"/>
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192"/>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap"
          rel="stylesheet"/>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
