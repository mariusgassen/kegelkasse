---
name: Generate poetry.lock

# Regenerates backend/poetry.lock after pushes to main and, if it changed, opens
# (or updates) a PR on the fixed branch `chore/poetry-lock` with auto-merge
# (squash) enabled, so main stays PR-only and the lock still lands once CI is green.
#
# Uses AUTOFIX_TOKEN (see dependabot-autopilot.yml): a PR created with
# GITHUB_TOKEN would not trigger CI, so its required checks would never report
# and auto-merge would never fire. Requires "Allow auto-merge" in repo settings.

on:
  push:
    branches:
      - main
    paths:
      - backend/pyproject.toml
      - backend/poetry.lock
  workflow_dispatch:

concurrency:
  group: generate-poetry-lock
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate poetry.lock
        working-directory: backend
        run: poetry lock

      - name: Open or update lock PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.AUTOFIX_TOKEN }}
          branch: chore/poetry-lock
          delete-branch: true
          add-paths: backend/poetry.lock
          commit-message: "chore: Update poetry.lock"
          title: "chore: Update poetry.lock"
          body: |
            Automated `poetry lock` after a change to `backend/pyproject.toml` on `main`.
            Auto-merges (squash) once required checks pass.

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash --repo "${{ github.repository }}"
