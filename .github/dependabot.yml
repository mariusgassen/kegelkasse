version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      # Conventional prefix so release-please picks bumps up: production deps land
      # under "Dependencies" (patch release), dev deps stay out of the changelog.
      prefix: "deps"
      prefix-development: "chore"
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    ignore:
      # @typescript-eslint (typescript-estree) declares peerDependencies.typescript:
      # ">=4.8.4 <6.1.0" and crashes against TS7 (the Corsa/native rewrite). Unblocks
      # when @typescript-eslint ships TS7 support — see CLAUDE.md's known blocking
      # constraints. Without this, the grouped dev-dependencies bump keeps re-including
      # an incompatible typescript major version and fails `npm run lint` every week.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      # Conventional prefix so release-please picks bumps up: production deps land
      # under "Dependencies" (patch release), dev deps stay out of the changelog.
      prefix: "deps"
      prefix-development: "chore"
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
